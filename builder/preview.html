<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
  <!-- The real engine stylesheet + the live theme (injected below). This is the
       same CSS the published page uses, so the preview is pixel-identical. -->
  <link rel="stylesheet" href="../engine/styles.css" id="engine-css">
  <style id="preview-theme"></style>
  <style>
    html, body { min-height: 100%; }
    /* The editor sizes the iframe (narrow = phone, wide = projector). */
  </style>
</head>
<body>
  <div id="preview-error" hidden style="padding:1rem;font:14px system-ui;color:#8c2318;"></div>

  <script>
  (function () {
    // mode comes from the hash: #phone or #projector
    var mode = (location.hash || '#projector').replace('#', '').split('?')[0] || 'projector';

    // The editor reloads this frame with ?t=<now> on every edit. Pass that token
    // down to the engine files too - without it the browser serves a cached
    // engine and the preview silently shows the previous version's behaviour,
    // which is indistinguishable from a bug in whatever you just changed.
    var bust = (location.search || '').replace(/^\?/, '');
    function engineUrl(path) { return path + (bust ? '?' + bust : ''); }
    var css = document.getElementById('engine-css');
    if (css && bust) css.href = engineUrl('../engine/styles.css');

    var data = {};
    try { data = JSON.parse(sessionStorage.getItem('builder_preview') || '{}'); }
    catch (e) {}

    if (!data || !Array.isArray(data.stages)) {
      var err = document.getElementById('preview-error');
      err.hidden = false;
      err.textContent = 'No presentation to preview yet - add a slide.';
      return;
    }

    // Content edits arrive from the editor as a call into the RUNNING page -
    // no iframe reload, no flash, no engine re-fetch per keystroke.
    window.__previewApply = function (next) {
      if (next.themeCss != null) document.getElementById('preview-theme').textContent = next.themeCss;
      var kick = document.querySelector('.header .kicker');
      if (kick) kick.textContent = next.kicker || '';
      var h1 = document.querySelector('.header h1');
      if (h1) h1.textContent = (mode === 'phone'
        ? (next.heading || next.title)
        : (next.projectorHeading || next.heading || next.title)) || '';
      var urlSpan = document.querySelector('.qr-corner-label span');
      if (urlSpan && next.lessonUrl) urlSpan.textContent = next.lessonUrl;
      if (next.cities) { window.CITIES = next.cities; window.MAP_BOUNDS = next.mapBounds || null; }
      if (window.__previewRefresh) window.__previewRefresh(next.stages);
      else window.STAGES = next.stages;
    };

    // Inject the per-presentation theme exactly as theme.css would.
    document.getElementById('preview-theme').textContent = data.themeCss || '';

    // Engine globals. Local-dev Firebase stub so store.js uses the localStorage
    // fallback (no network, no live writes). A throwaway LESSON_ID keeps preview
    // votes from colliding with any real lesson.
    window.LESSON_ID = '__preview__' + (data.lessonId || 'demo');
    // Start the engine on the slide the editor has selected (store.js reads the
    // current stage from this localStorage key on init), so edits show at once.
    if (typeof data.startStage === 'number') {
      try { localStorage.setItem(window.LESSON_ID + '_state_stage',
        JSON.stringify({ stage: data.startStage, epoch: 0, ts: 0 })); } catch (e) {}
    }
    window.STAGES = data.stages;            // already engine-normalized by the editor
    if (data.cities) { window.CITIES = data.cities; window.MAP_BOUNDS = data.mapBounds || null; }
    window.FIREBASE_CONFIG = { apiKey: 'REPLACE_ME' };
    window.IS_LIVE = false;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function logo() {
      return data.logo
        ? '<div class="header-logos"><img class="brand-logo" src="' + esc(data.logo) +
          '" alt="" onerror="this.style.display=\'none\'"></div>'
        : '';
    }
    function header(heading) {
      return '<header class="header">' + logo() +
        '<div class="header-text"><div class="kicker">' + esc(data.kicker || '') +
        '</div><h1>' + esc(heading) + '</h1></div></header>';
    }

    // Build the same DOM scaffold the published shell uses, per mode.
    if (mode === 'phone') {
      document.body.innerHTML =
        '<div id="dev-banner" class="dev-banner" hidden></div>' +
        header(data.heading || data.title || '') +
        '<main class="main"><div id="stage-root"></div></main>';
    } else {
      document.body.className = 'projector';
      document.body.innerHTML =
        '<div id="dev-banner" class="dev-banner" hidden></div>' +
        '<aside class="qr-corner" aria-label="Join on your phone">' +
          '<div id="qr-code"></div>' +
          '<div class="qr-corner-label"><strong>Vote on your phone</strong>' +
          '<span>' + esc(data.lessonUrl || '') + '</span></div></aside>' +
        header(data.projectorHeading || data.heading || data.title || '') +
        '<main class="main"><div id="stage-pane" class="stage-pane"></div>' +
        '<aside id="results-pane" class="results-pane"></aside></main>' +
        '<div class="controls">' +
          '<span id="auth-who" class="auth-who"></span>' +
          '<button id="auth-btn" class="auth-btn" type="button">Sign in to control</button>' +
          '<button id="reset-btn" class="reset" title="Wipe all votes">Reset</button>' +
          '<button id="prev-btn">‹ Back</button>' +
          '<span id="stage-indicator" class="stage-indicator">- / -</span>' +
          '<button id="next-btn">Next ›</button></div>';
    }

    // Nothing to render yet: a friendly hint beats the engine's "Lesson
    // complete." (its out-of-range fallback) or a silent white rectangle.
    if (!data.stages.length) {
      var target = document.getElementById('stage-root') || document.getElementById('stage-pane');
      if (target) target.innerHTML =
        '<div class="connecting" style="animation:none;">Nothing to preview yet - your first slide will appear here.</div>';
      return;
    }

    // Load the engine the same way the shells do: store.js (module) first, then
    // the renderer once window.createStore exists.
    var store = document.createElement('script');
    store.type = 'module';
    store.src = engineUrl('../engine/store.js');
    document.body.appendChild(store);
    (function waitForStore() {
      if (window.createStore) {
        var s = document.createElement('script');
        s.src = engineUrl(mode === 'phone' ? '../engine/vote.js' : '../engine/results.js');
        document.body.appendChild(s);
      } else { setTimeout(waitForStore, 30); }
    })();
  })();
  </script>
</body>
</html>
