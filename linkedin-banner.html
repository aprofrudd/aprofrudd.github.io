<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1584">
<title>LinkedIn Banner - Dr Alan Ruddock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    width: 1584px;
    height: 396px;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .banner {
    width: 1584px;
    height: 396px;
    background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    overflow: hidden;
  }

  /* Subtle geometric decoration */
  .banner::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background:
      radial-gradient(ellipse 800px 400px at 85% 50%, rgba(59, 130, 246, 0.06) 0%, transparent 70%),
      radial-gradient(ellipse 600px 300px at 20% 80%, rgba(59, 130, 246, 0.04) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Thin accent line at the top */
  .banner::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 3px;
    background: linear-gradient(270deg, #3b82f6 0%, rgba(59, 130, 246, 0.3) 50%, transparent 75%);
  }

  /* Subtle dot grid pattern */
  .dot-pattern {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: radial-gradient(circle, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  /* Diagonal accent lines in the background */
  .accent-lines {
    position: absolute;
    right: 200px;
    top: -50px;
    width: 400px;
    height: 500px;
    opacity: 0.04;
    pointer-events: none;
  }

  .accent-lines div {
    position: absolute;
    width: 1px;
    height: 500px;
    background: #3b82f6;
    transform: rotate(25deg);
  }

  .accent-lines div:nth-child(1) { left: 0; }
  .accent-lines div:nth-child(2) { left: 40px; }
  .accent-lines div:nth-child(3) { left: 80px; }
  .accent-lines div:nth-child(4) { left: 120px; }
  .accent-lines div:nth-child(5) { left: 160px; }

  .content {
    position: relative;
    z-index: 1;
    padding-right: 80px;
    max-width: 60%;
    text-align: right;
  }

  .name {
    font-size: 46px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.5px;
    line-height: 1.15;
    margin-bottom: 10px;
  }

  .title {
    font-size: 19px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.88);
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .affiliation {
    font-size: 15px;
    font-weight: 400;
    color: #3b82f6;
    line-height: 1.4;
    margin-bottom: 14px;
  }

  .metrics {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.45);
    letter-spacing: 0.3px;
    margin-bottom: 12px;
  }

  .website {
    font-size: 13px;
    font-weight: 500;
    color: #3b82f6;
    letter-spacing: 0.2px;
    opacity: 0.85;
  }

  /* Vertical accent bar next to the content */
  .accent-bar {
    position: absolute;
    right: 60px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 180px;
    background: linear-gradient(180deg, transparent 0%, #3b82f6 30%, #3b82f6 70%, transparent 100%);
    opacity: 0.5;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="dot-pattern"></div>
    <div class="accent-lines">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
    <div class="accent-bar"></div>
    <div class="content">
      <div class="name">Dr Alan Ruddock</div>
      <div class="title">Associate Professor of Sport Physiology &amp; Performance</div>
      <div class="affiliation">Sheffield Hallam University &nbsp;|&nbsp; Co-Founder, Boxing Science</div>
      <div class="metrics">50+ publications &middot; h-index: 26 &middot; 1,776 citations</div>
      <div class="website">alanruddock.com</div>
    </div>
  </div>
</body>
</html>
