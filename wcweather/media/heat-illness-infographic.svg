<?xml version="1.0" encoding="UTF-8"?>
<!--
  Exertional heat illness vs exertional heat stroke.
  Signs from Esh et al. (2026), Sports Medicine, Table 1.
  Scotland player centre; amber warning tier left; red emergency tier right.
  Palette matches the wcweather parchment theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="escalate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d98a3d"/>
      <stop offset="1" stop-color="#a8261c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3c969" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f3c969" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#3a261e" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Parchment background -->
  <rect width="1280" height="720" fill="#faf4e6"/>

  <!-- Faint heat sun + shimmer behind the player -->
  <circle cx="585" cy="120" r="150" fill="url(#sun)"/>
  <g stroke="#d98a3d" stroke-width="3" stroke-linecap="round" opacity="0.25">
    <path d="M470 95 q10 -12 20 0 q10 12 20 0" fill="none"/>
    <path d="M650 90 q10 -12 20 0 q10 12 20 0" fill="none"/>
    <path d="M560 70 q10 -12 20 0 q10 12 20 0" fill="none"/>
  </g>

  <!-- ============ CENTRE: Scotland footballer ============ -->
  <g filter="url(#soft)">
    <!-- legs -->
    <rect x="556" y="430" width="22" height="120" rx="10" fill="#e7b291"/>
    <rect x="602" y="430" width="22" height="120" rx="10" fill="#e7b291"/>
    <!-- socks -->
    <rect x="554" y="540" width="26" height="40" rx="6" fill="#15243f"/>
    <rect x="600" y="540" width="26" height="40" rx="6" fill="#15243f"/>
    <!-- boots -->
    <path d="M552 580 h30 q14 0 18 10 l2 8 q1 6 -6 6 h-44 q-4 0 -4 -5 z" fill="#2a2018"/>
    <path d="M598 580 h30 q14 0 18 10 l2 8 q1 6 -6 6 h-44 q-4 0 -4 -5 z" fill="#2a2018"/>
    <!-- shorts -->
    <path d="M548 360 h84 q8 0 8 8 v44 q0 6 -6 6 h-30 l-6 -34 -6 34 h-30 q-6 0 -6 -6 v-44 q0 -8 8 -8 z" fill="#f4f0e6" stroke="#c9bfa6" stroke-width="1.5"/>
    <!-- arms -->
    <rect x="498" y="250" width="20" height="120" rx="10" fill="#e7b291"/>
    <rect x="662" y="250" width="20" height="120" rx="10" fill="#e7b291"/>
    <circle cx="508" cy="378" r="11" fill="#e7b291"/>
    <circle cx="672" cy="378" r="11" fill="#e7b291"/>
    <!-- shirt / torso -->
    <path d="M520 232 q60 -34 140 0 l-6 28 -28 -8 v126 q0 8 -8 8 h-58 q-8 0 -8 -8 v-126 l-28 8 z" fill="#15243f"/>
    <!-- sleeves -->
    <path d="M520 232 l-26 18 14 26 30 -22 z" fill="#1d3358"/>
    <path d="M660 232 l26 18 -14 26 -30 -22 z" fill="#1d3358"/>
    <!-- saltire badge on chest -->
    <rect x="566" y="262" width="34" height="26" rx="3" fill="#1f4a8a"/>
    <path d="M566 262 L600 288 M600 262 L566 288" stroke="#ffffff" stroke-width="4"/>
    <!-- neck -->
    <rect x="568" y="206" width="24" height="22" fill="#e7b291"/>
    <!-- head -->
    <circle cx="580" cy="176" r="40" fill="#e7b291"/>
    <!-- hair -->
    <path d="M542 168 q4 -42 38 -44 q34 2 38 44 q-12 -18 -38 -18 q-26 0 -38 18 z" fill="#5a3b25"/>
    <!-- flushed cheeks (heat cue) -->
    <circle cx="562" cy="186" r="7" fill="#d96b62" opacity="0.5"/>
    <circle cx="598" cy="186" r="7" fill="#d96b62" opacity="0.5"/>
    <!-- sweat drips -->
    <path d="M616 150 q6 8 0 14 q-6 -6 0 -14 z" fill="#7db3d9" opacity="0.8"/>
    <path d="M544 200 q5 7 0 12 q-5 -5 0 -12 z" fill="#7db3d9" opacity="0.8"/>
  </g>

  <!-- connector dots on the player's left -->
  <g fill="#d98a3d">
    <circle cx="540" cy="172" r="4"/>  <!-- head -->
    <circle cx="528" cy="270" r="4"/>  <!-- chest -->
    <circle cx="534" cy="330" r="4"/>  <!-- stomach -->
    <circle cx="548" cy="470" r="4"/>  <!-- legs -->
  </g>

  <!-- ============ LEFT TIER: heat illness (amber) ============ -->
  <text x="24" y="70" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#a35e16">EXERTIONAL HEAT ILLNESS</text>
  <text x="24" y="94" font-size="15" fill="#6b4a3e">Warning signs — what you spot first on the pitch</text>

  <!-- amber chips + leader lines -->
  <g font-size="18" fill="#7a4717">
    <!-- leader lines -->
    <g stroke="#d98a3d" stroke-width="1.5" opacity="0.55" fill="none">
      <path d="M360 133 L540 172"/>
      <path d="M360 197 L540 172"/>
      <path d="M360 261 L528 270"/>
      <path d="M360 325 L534 330"/>
      <path d="M360 389 L534 330"/>
      <path d="M360 453 L548 470"/>
      <path d="M360 517 L548 470"/>
    </g>
    <g>
      <rect x="24" y="113" width="336" height="40" rx="20" fill="#f6e3c8" stroke="#d98a3d" stroke-width="1.5" filter="url(#soft)"/>
      <text x="44" y="139">Headache</text>
      <rect x="24" y="177" width="336" height="40" rx="20" fill="#f6e3c8" stroke="#d98a3d" stroke-width="1.5" filter="url(#soft)"/>
      <text x="44" y="203">Dizziness</text>
      <rect x="24" y="241" width="336" height="40" rx="20" fill="#f6e3c8" stroke="#d98a3d" stroke-width="1.5" filter="url(#soft)"/>
      <text x="44" y="267">Tachycardia (racing heart)</text>
      <rect x="24" y="305" width="336" height="40" rx="20" fill="#f6e3c8" stroke="#d98a3d" stroke-width="1.5" filter="url(#soft)"/>
      <text x="44" y="331">Nausea</text>
      <rect x="24" y="369" width="336" height="40" rx="20" fill="#f6e3c8" stroke="#d98a3d" stroke-width="1.5" filter="url(#soft)"/>
      <text x="44" y="395">Fatigue</text>
      <rect x="24" y="433" width="336" height="40" rx="20" fill="#f6e3c8" stroke="#d98a3d" stroke-width="1.5" filter="url(#soft)"/>
      <text x="44" y="459">Muscle cramps</text>
      <rect x="24" y="497" width="336" height="40" rx="20" fill="#f6e3c8" stroke="#d98a3d" stroke-width="1.5" filter="url(#soft)"/>
      <text x="44" y="523">Unsteadiness &amp; weakness</text>
    </g>
  </g>

  <!-- ============ ESCALATION ARROW ============ -->
  <text x="812" y="300" font-size="15" font-style="italic" fill="#6b4a3e" text-anchor="middle">can escalate to</text>
  <path d="M735 330 H865 v-16 l34 24 -34 24 v-16 H735 z" fill="url(#escalate)"/>

  <!-- ============ RIGHT TIER: heat stroke (red) ============ -->
  <rect x="912" y="104" width="344" height="470" rx="16" fill="#fbeae7" stroke="#a8261c" stroke-width="2"/>
  <text x="934" y="150" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#a8261c">EXERTIONAL</text>
  <text x="934" y="180" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#a8261c">HEAT STROKE</text>

  <!-- emergency badge -->
  <rect x="934" y="198" width="232" height="34" rx="17" fill="#a8261c"/>
  <text x="950" y="221" font-size="16" font-weight="700" fill="#ffffff">⚠ MEDICAL EMERGENCY</text>

  <!-- red chips -->
  <g fill="#7c1d15">
    <rect x="934" y="258" width="300" height="44" rx="12" fill="#f4d3ce" stroke="#a8261c" stroke-width="1.5"/>
    <text x="952" y="285" font-size="18">Any / all heat-illness signs</text>

    <rect x="934" y="316" width="300" height="74" rx="12" fill="#f4d3ce" stroke="#a8261c" stroke-width="1.5"/>
    <text x="952" y="345" font-size="18" font-weight="700">CNS dysfunction</text>
    <text x="952" y="370" font-size="14">confusion · disorientation</text>
    <text x="952" y="386" font-size="14">· collapse · seizure</text>

    <rect x="934" y="404" width="300" height="44" rx="12" fill="#f4d3ce" stroke="#a8261c" stroke-width="1.5"/>
    <text x="952" y="431" font-size="18" font-weight="700">Core temperature &#8805; 40 &#176;C</text>
  </g>
  <text x="934" y="492" font-size="14" fill="#7c1d15" opacity="0.85">Left untreated, exertional heat stroke</text>
  <text x="934" y="510" font-size="14" fill="#7c1d15" opacity="0.85">can be fatal within minutes.</text>

  <!-- footer source -->
  <text x="24" y="700" font-size="13" fill="#9a7d6f">Signs from Esh et al., 2026 — Sports Medicine, Table 1 (doi:10.1007/s40279-026-02398-4)</text>
</svg>
