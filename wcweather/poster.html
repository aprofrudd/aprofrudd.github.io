<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf4e6">
  <title>Build your poster — World Cup 2026 Heat</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="poster.css">
</head>
<body>
  <div class="page">
    <div class="intro">
      <div class="kicker">FIFA World Cup 2026 · Heat &amp; Performance</div>
      <h1>Build your research poster</h1>
      <p>Your answers from today have been turned into an academic-style poster for the CASES Outreach competition. Add your name and school, then save it.</p>
    </div>

    <div class="form">
      <div>
        <label for="f-name">Your name</label>
        <input id="f-name" type="text" autocomplete="name" placeholder="e.g. Alan Ruddock">
      </div>
      <div>
        <label for="f-school">Your school</label>
        <input id="f-school" type="text" autocomplete="organization" placeholder="e.g. Sheffield Hallam High School">
      </div>
      <div>
        <label for="f-title">Poster title (you can change it)</label>
        <input id="f-title" type="text" placeholder="Poster title">
      </div>
    </div>

    <div class="actions">
      <button id="save-btn" class="save-btn" type="button">⬇ Save my poster (PNG)</button>
      <span id="save-status" class="save-status"></span>
    </div>
    <p class="hint">Tip: on a phone you can also press and hold the poster to save the image.</p>

    <div class="poster-frame" id="poster-frame">
      <div class="poster-scaler" id="poster-scaler">
        <div id="poster"></div>
      </div>
    </div>
  </div>

  <script src="lesson.config.js"></script>
  <script src="cities.js"></script>
  <script src="stages.js"></script>
  <script src="poster-template.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="poster.js"></script>
</body>
</html>
