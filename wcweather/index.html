<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf4e6">
  <title>World Cup 2026 — Vote</title>
  <meta name="description" content="Classroom poll: where will the hottest match of the FIFA World Cup 2026 be?">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="dev-banner" class="dev-banner" hidden></div>

  <header class="header">
    <div class="kicker">FIFA World Cup 2026 · Heat &amp; Performance</div>
    <h1>Dr Alan Ruddock — Sport Physiology</h1>
  </header>

  <main class="main">
    <div id="stage-root"></div>
  </main>

  <script src="cities.js"></script>
  <script src="stages.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="store.js"></script>
  <script>
    // Wait for the module to register window.createStore before running vote.js
    (function waitForStore() {
      if (window.createStore) {
        const s = document.createElement('script');
        s.src = 'vote.js';
        document.body.appendChild(s);
      } else {
        setTimeout(waitForStore, 30);
      }
    })();
  </script>
</body>
</html>
